# El navegador manda Origin también en los POST al mismo origen, y el backend solo admite
# FRONTEND_URL. Si Origin es este mismo host, se quita; si es otro, pasa y el backend da 403.
map "$http_origin|$http_host" $origen_api {
  "~^https?://([^/|]+)\|\1$" "";
  default $http_origin;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  location ~ ^/(customers|simulations|salud)(/|$) {
    proxy_pass http://backend:3000;
    proxy_set_header Origin $origen_api;
  }

  # Rutas de Angular (/clientes/7): no son ficheros, las resuelve index.html.
  location / {
    try_files $uri /index.html;
  }
}
