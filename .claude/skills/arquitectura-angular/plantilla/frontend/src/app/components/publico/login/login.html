<main class="mx-auto mt-[10vh] max-w-sm px-4">
  <h1 class="mb-6 text-2xl font-medium">{{ 'login.titulo' | translate }}</h1>

  <form [formGroup]="formulario" (ngSubmit)="entrar()" novalidate class="flex flex-col gap-1">
    <!-- mat-error se muestra solo cuando el campo es invalido y se ha tocado -->
    <mat-form-field appearance="outline">
      <mat-label>{{ 'login.email' | translate }}</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="username" />
      <mat-error>{{ 'login.emailInvalido' | translate }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ 'login.password' | translate }}</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="current-password" />
      <mat-error>{{ 'login.passwordObligatoria' | translate }}</mat-error>
    </mat-form-field>

    @if (error()) {
      <p class="mb-3 text-peligro" role="alert">{{ error() }}</p>
    }

    <button mat-flat-button type="submit" [disabled]="enviando()">
      {{ (enviando() ? 'login.entrando' : 'login.entrar') | translate }}
    </button>
  </form>
</main>
