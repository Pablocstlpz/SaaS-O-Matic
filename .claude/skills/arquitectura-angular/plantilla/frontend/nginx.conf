server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un fichero real la resuelve Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # los ficheros con hash en el nombre (main-XXXX.js) no cambian nunca: cache larga
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html SI cambia en cada despliegue: sin cache, o el navegador pide JS que ya no existe
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
