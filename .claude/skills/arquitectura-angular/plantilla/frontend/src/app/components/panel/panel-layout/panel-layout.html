<header class="flex items-center gap-2 border-b border-borde bg-superficie px-4 py-2">
  <strong class="mr-4">{{ 'panel.nombreApp' | translate }}</strong>

  <nav class="flex flex-1 gap-4">
    <a routerLink="productos" routerLinkActive="activo" class="enlace">
      {{ 'panel.menu.productos' | translate }}
    </a>
  </nav>

  <span class="hidden text-suave sm:inline">{{ sesion.usuario()?.nombre }}</span>

  <button mat-button type="button" (click)="alternarIdioma()" [attr.aria-label]="'comun.cambiarIdioma' | translate">
    {{ idioma.actual() === 'es' ? 'EN' : 'ES' }}
  </button>
  <button mat-icon-button type="button" (click)="salir()" [attr.aria-label]="'comun.salir' | translate">
    <mat-icon>logout</mat-icon>
  </button>
</header>

<main class="mx-auto max-w-4xl px-4 py-6">
  <router-outlet />
</main>
